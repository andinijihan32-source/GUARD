<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GUARD — Recognize, Decide, Respond</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Sora:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F4EE; --bg-deep:#123D38; --ink:#16302C; --ink-soft:#4B615D;
  --teal:#1F6F65; --teal-dark:#123D38; --mint:#DCEDE8; --mint-line:#BFDAD4;
  --coral:#E8875A; --coral-soft:#F6DCC9; --amber:#C97A2B; --amber-soft:#F3E1C8;
  --rose:#F2E9E0; --sage:#CBD9C6; --white:#FFFFFF;
  --radius:20px; --radius-sm:12px;
  --shadow: 0 8px 24px rgba(18,61,56,0.08);
  --shadow-lg: 0 20px 50px rgba(18,61,56,0.16);
  --maxw: 900px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg); color:var(--ink); font-family:'Sora',sans-serif; -webkit-font-smoothing:antialiased; min-height:100vh;}
h1,h2,h3,.display{font-family:'Fraunces',serif; font-weight:600; letter-spacing:-0.01em; margin:0;}
.mono{font-family:'IBM Plex Mono',monospace; letter-spacing:0.04em; text-transform:uppercase;}
button{font-family:inherit; cursor:pointer;}
a{color:inherit;}
input,textarea{font-family:inherit;}
::selection{background:var(--coral-soft);}
:focus-visible{outline:3px solid var(--coral); outline-offset:2px;}

#app{max-width:var(--maxw); margin:0 auto; min-height:100vh; position:relative; padding-bottom:70px;}
@media(min-width:960px){ #app{max-width:1000px;} }

/* ---- top header ---- */
.topbar{
  position:sticky; top:0; z-index:60; background:rgba(246,244,238,0.94); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--mint-line); padding:12px 18px; display:flex; align-items:center; justify-content:space-between;
}
.topbar-brand{display:flex; align-items:center; gap:8px; font-weight:700; color:var(--teal-dark); font-size:15px;}
.topbar-brand .ico{width:26px;height:26px;border-radius:50%;background:var(--teal);display:flex;align-items:center;justify-content:center;color:white;font-family:'Fraunces',serif;font-size:13px;}
.topbar-actions{display:flex; align-items:center; gap:10px;}
.icon-btn{width:34px;height:34px;border-radius:50%;background:var(--mint);border:none;display:flex;align-items:center;justify-content:center; position:relative;}
.icon-btn .dot{position:absolute; top:2px; right:2px; width:8px; height:8px; border-radius:50%; background:var(--coral); border:2px solid var(--bg);}
.back-btn{background:none;border:none; display:flex; align-items:center; gap:6px; font-size:13px; color:var(--ink-soft); font-weight:600;}

/* ---- screen ---- */
.screen{padding:0 18px 40px; animation:fadeUp .4s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
@media(prefers-reduced-motion:reduce){.screen{animation:none;}}

.card{background:var(--white); border-radius:var(--radius); padding:24px; box-shadow:var(--shadow); border:1px solid rgba(18,61,56,0.05);}
.btn{padding:13px 24px; border-radius:100px; border:none; font-weight:600; font-size:14px; display:inline-flex; align-items:center; gap:8px; transition:transform .15s, box-shadow .15s;}
.btn-primary{background:var(--teal-dark); color:white;}
.btn-primary:hover{transform:translateY(-2px); box-shadow:0 10px 24px rgba(18,61,56,0.25);}
.btn-primary:disabled{opacity:.35; transform:none; box-shadow:none; cursor:not-allowed;}
.btn-ghost{background:transparent; color:var(--teal-dark); border:1.5px solid var(--mint-line);}
.btn-coral{background:var(--coral); color:white;}
.btn-coral:hover{transform:translateY(-2px); box-shadow:0 10px 24px rgba(232,135,90,0.3);}
.btn-block{width:100%; justify-content:center;}
.field{margin-bottom:14px;}
.field label{font-size:12px; color:var(--ink-soft); display:block; margin-bottom:6px; font-weight:600;}
.field input{width:100%; padding:13px 16px; border-radius:14px; border:1.5px solid var(--mint-line); font-size:14px; background:var(--bg);}
.field input:focus{border-color:var(--teal);}
.err{color:#A5401F; font-size:12px; margin-top:6px;}

/* ---- auth screens ---- */
.auth-wrap{min-height:80vh; display:flex; flex-direction:column; justify-content:center; padding-top:20px;}
.auth-logo{text-align:center; margin-bottom:28px;}
.auth-logo .ico{width:56px;height:56px;border-radius:50%;background:var(--teal-dark); color:white; display:flex;align-items:center;justify-content:center; margin:0 auto 14px; font-family:'Fraunces',serif; font-size:26px;}
.auth-logo h1{font-size:24px; color:var(--teal-dark);}
.auth-logo p{font-size:13px; color:var(--ink-soft); margin-top:6px;}
.auth-switch{text-align:center; margin-top:18px; font-size:13px; color:var(--ink-soft);}
.auth-switch button{background:none;border:none;color:var(--teal); font-weight:600; text-decoration:underline; text-underline-offset:3px;}

/* ---- consent ---- */
.consent-card{background:var(--white); border-radius:var(--radius); padding:28px; box-shadow:var(--shadow-lg); margin-top:24px;}
.consent-card h2{font-size:20px; color:var(--teal-dark);}
.consent-item{display:flex; gap:12px; margin-top:16px; font-size:13.5px; line-height:1.6; color:var(--ink-soft);}
.consent-item .em{font-size:20px; flex:none;}
.consent-checkbox{display:flex; align-items:flex-start; gap:10px; margin-top:22px; padding-top:18px; border-top:1px solid var(--mint-line); font-size:13px;}
.consent-checkbox input{margin-top:3px;}

/* ---- beranda ---- */
.hai{padding:26px 0 6px; text-align:center;}
.hai h2{font-size:24px; color:var(--teal-dark);}
.hai .affirm{font-style:italic; color:var(--ink-soft); font-size:14px; margin-top:10px; max-width:340px; margin-left:auto; margin-right:auto;}
.journey-label{text-align:center; margin:22px 0 14px; font-size:12px; letter-spacing:.05em; color:var(--teal); font-weight:700;}
.badges-row{display:flex; justify-content:center; gap:26px; margin-bottom:24px;}
.badge-item{text-align:center;}
.badge-circle{width:54px;height:54px;border-radius:50%; display:flex;align-items:center;justify-content:center; font-size:22px; margin:0 auto 8px; border:2px solid var(--mint-line); background:var(--white);}
.badge-circle.done{background:linear-gradient(160deg,var(--teal),var(--teal-dark)); border-color:var(--teal-dark); color:white;}
.badge-item .lbl{font-size:11px; color:var(--ink-soft); font-weight:600;}
.badge-lock{font-size:12px; margin-top:2px;}

.nav-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:8px;}
@media(min-width:640px){.nav-grid{grid-template-columns:repeat(3,1fr);}}
.nav-card{background:var(--white); border:1.5px solid var(--mint-line); border-radius:16px; padding:18px 14px; text-align:center; box-shadow:var(--shadow); transition:transform .15s;}
.nav-card:hover{transform:translateY(-3px); border-color:var(--teal);}
.nav-card .ic{font-size:24px; margin-bottom:8px;}
.nav-card .lb{font-size:12.5px; font-weight:700; color:var(--ink);}
.nav-card.wide{grid-column:1/-1;}


/* ---- fixed bottom bar ---- */
.fixedbar{
  position:fixed; bottom:0; left:0; right:0; z-index:70;
  background:var(--white); border-top:1px solid var(--mint-line);
  padding:10px 18px; display:flex; justify-content:center; gap:10px;
  box-shadow:0 -6px 20px rgba(18,61,56,0.08);
}
.fixedbar-inner{max-width:var(--maxw); width:100%; display:flex; justify-content:space-between; gap:10px;}
.fbar-btn{flex:1; display:flex; align-items:center; justify-content:center; gap:6px; padding:11px; border-radius:100px; border:1.5px solid var(--mint-line); background:var(--bg); font-size:12.5px; font-weight:700; color:var(--ink-soft);}
.fbar-btn.danger{border-color:#E3B9A6; color:#A5401F; background:#FBEEE7;}

/* ---- floating help ---- */
.float-help{
  position:fixed; bottom:78px; right:16px; z-index:80;
  width:52px; height:52px; border-radius:50%; background:var(--coral); color:white; border:none;
  display:flex; align-items:center; justify-content:center; font-size:22px; box-shadow:0 10px 24px rgba(232,135,90,0.45);
}
.sheet-overlay{position:fixed; inset:0; background:rgba(18,61,56,0.45); z-index:90; display:flex; align-items:flex-end; justify-content:center;}
.sheet{max-width:var(--maxw); width:100%; background:var(--white); border-radius:24px 24px 0 0; padding:26px 22px 30px; animation:sheetUp .3s ease;}
@keyframes sheetUp{from{transform:translateY(30px); opacity:0;}to{transform:translateY(0); opacity:1;}}
.sheet h3{font-size:17px; color:var(--teal-dark);}
.sheet p.lead{font-size:13.5px; color:var(--ink-soft); margin-top:8px; line-height:1.5;}
.contact-item{display:flex; align-items:center; gap:12px; padding:14px; background:var(--mint); border-radius:14px; margin-top:12px;}
.contact-item .ic{width:36px;height:36px;border-radius:50%;background:var(--teal-dark); color:white; display:flex;align-items:center;justify-content:center; flex:none;}
.contact-item .txt b{display:block; font-size:13.5px;}
.contact-item .txt span{font-size:12px; color:var(--ink-soft);}
.sheet-close{margin-top:18px;}

/* quick hide overlay */
.hide-overlay{position:fixed; inset:0; background:#ffffff; z-index:200; display:flex; align-items:center; justify-content:center; cursor:pointer;}
.hide-overlay .hint{color:#ccc; font-size:11px; position:absolute; bottom:20px;}

/* ---- section head ---- */
.section-head{padding:24px 0 16px;}
.section-head .mono{font-size:10.5px; color:var(--coral); font-weight:700;}
.section-head h2{font-size:clamp(22px,5vw,30px); color:var(--teal-dark); margin-top:6px;}
.section-head p{color:var(--ink-soft); font-size:13.5px; margin-top:8px; line-height:1.55;}

/* ---- materi cards / stepper ---- */
.materi-progress{display:flex; gap:5px; margin:14px 0 20px;}
.materi-progress .seg{flex:1; height:4px; border-radius:4px; background:var(--mint-line);}
.materi-progress .seg.active{background:var(--coral);}
.materi-progress .seg.done{background:var(--teal);}
.materi-card{background:var(--white); border-radius:var(--radius); padding:26px; box-shadow:var(--shadow-lg); min-height:280px; display:flex; flex-direction:column;}
.materi-card .tag{font-size:10.5px; font-weight:700; color:var(--coral); text-transform:uppercase; letter-spacing:.05em;}
.materi-card h3{font-size:19px; color:var(--teal-dark); margin-top:8px;}
.materi-card .body{margin-top:14px; font-size:14px; line-height:1.65; color:var(--ink); flex:1;}
.materi-card .body p{margin:0 0 10px;}
.materi-card .body ul{margin:0; padding-left:20px;}
.materi-card .body li{margin-bottom:6px;}
.materi-card .callout{margin-top:14px; padding:12px 14px; background:var(--mint); border-radius:12px; font-size:13px; color:var(--teal-dark); border-left:3px solid var(--teal);}
.materi-card .callout.warn{background:var(--amber-soft); border-left-color:var(--amber); color:#7A4A17;}
.materi-nav{display:flex; justify-content:space-between; margin-top:20px;}

.dekat-table{width:100%; border-collapse:collapse; margin-top:14px; font-size:12.5px;}
.dekat-table th{background:var(--teal-dark); color:white; padding:8px 10px; text-align:left; font-size:11px;}
.dekat-table td{padding:9px 10px; border-bottom:1px solid var(--mint-line); vertical-align:top;}
.dekat-table tr:nth-child(even) td{background:var(--mint);}

/* ---- lyric bedah ---- */


/* ---- case study ---- */
.case-card{background:var(--white); border-radius:var(--radius); padding:22px; box-shadow:var(--shadow); margin-top:16px;}
.case-card .badge-ctx{display:inline-block; font-size:10.5px; font-weight:700; padding:4px 10px; border-radius:100px; background:var(--mint); color:var(--teal-dark); margin-bottom:10px;}
.case-card p{font-size:13.5px; line-height:1.6; color:var(--ink);}
.case-card .impact{margin-top:12px; padding:12px; background:var(--rose); border-radius:12px; font-size:12.5px; color:var(--ink-soft);}

/* ---- chat sim ---- */
.chat-frame{margin-top:16px; background:#EAF3F1; border-radius:var(--radius); padding:16px; box-shadow:var(--shadow); min-height:280px;}
.chat-header{display:flex;align-items:center;gap:10px; padding-bottom:12px; border-bottom:1px solid #D3E5E1; margin-bottom:12px;}
.chat-avatar{width:32px;height:32px;border-radius:50%;background:var(--ink-soft); flex:none;}
.chat-day{font-size:11px; font-weight:700; color:var(--teal-dark); text-align:center; margin:10px 0 6px;}
.bubble{max-width:80%; padding:11px 15px; border-radius:16px; font-size:13.5px; line-height:1.45; margin-bottom:8px;}
.bubble.them{background:white; border-bottom-left-radius:4px;}
.bubble.me{background:var(--teal); color:white; margin-left:auto; border-bottom-right-radius:4px;}
.chat-choices{margin-top:14px; display:flex; flex-direction:column; gap:8px;}
.chat-choice{text-align:left; background:white; border:1.5px solid var(--mint-line); border-radius:14px; padding:11px 15px; font-size:13px;}
.chat-choice:hover{border-color:var(--teal);}
.stop-box{margin-top:14px; padding:14px; background:var(--amber-soft); border-radius:12px; font-size:13px; color:#7A4A17;}

/* ---- roleplay babak ---- */
.babak-tag{font-size:11px; font-weight:700; color:var(--coral); text-transform:uppercase;}
.babak-dialogue{margin-top:10px;}
.dline{margin-bottom:10px; font-size:13.5px; line-height:1.5;}
.dline b{color:var(--teal-dark); display:block; font-size:11.5px; margin-bottom:2px; text-transform:uppercase; letter-spacing:.03em;}
.dekat-tag-inline{display:inline-block; margin-top:12px; padding:6px 12px; border-radius:100px; background:var(--mint); color:var(--teal-dark); font-size:11px; font-weight:700;}
.role-pill{font-size:11px; font-weight:700; padding:6px 12px; border-radius:100px; background:var(--teal-dark); color:white;}

/* ---- quiz (Cek Paham) ---- */
.quiz-progress{font-size:12px; color:var(--ink-soft); margin-bottom:8px;}
.quiz-q{background:white; border-radius:var(--radius); padding:20px; box-shadow:var(--shadow); margin-bottom:12px;}
.quiz-q .qtext{font-size:14px; font-weight:600; margin-bottom:12px; line-height:1.5;}
.quiz-opt{display:block; width:100%; text-align:left; background:var(--bg); border:1.5px solid var(--mint-line); border-radius:12px; padding:11px 14px; font-size:13px; margin-bottom:8px;}
.quiz-opt.correct{background:#DCEDE8; border-color:var(--teal);}
.quiz-opt.wrong{background:#F6D9CC; border-color:#C1502E;}
.quiz-result{text-align:center; padding:30px 20px; background:var(--white); border-radius:var(--radius); box-shadow:var(--shadow-lg);}
.quiz-result .score{font-size:40px; font-family:'Fraunces',serif; color:var(--teal-dark); font-weight:700;}
.quiz-result p{color:var(--ink-soft); font-size:13.5px; margin-top:8px;}

/* ---- protect ---- */
.breath-circle{width:180px; height:180px; border-radius:50%; background:radial-gradient(circle at 30% 30%, var(--mint), var(--teal)); margin:30px auto; transition:transform 4s ease-in-out; display:flex; align-items:center; justify-content:center; color:white; font-weight:700; font-size:13px;}
.breath-circle.in{transform:scale(1.3);}
.breath-circle.out{transform:scale(0.75);}
.affirm-pick-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:16px;}
@media(max-width:480px){.affirm-pick-grid{grid-template-columns:1fr;}}
.affirm-pick{padding:18px; border-radius:16px; border:2px solid var(--mint-line); background:white; font-size:13px; text-align:left; cursor:pointer; line-height:1.5;}
.affirm-pick.selected{border-color:var(--coral); background:var(--coral-soft);}
.support-row{display:flex; gap:10px; margin-top:12px; align-items:center;}
.support-row input{flex:1; padding:12px 14px; border-radius:12px; border:1.5px solid var(--mint-line);}
.opener-opt{display:block; width:100%; text-align:left; background:white; border:1.5px solid var(--mint-line); border-radius:12px; padding:12px 15px; font-size:13px; margin-bottom:8px;}
.opener-opt.selected{border-color:var(--teal); background:var(--mint);}
.summary-card{background:var(--teal-dark); color:white; border-radius:var(--radius); padding:24px; margin-top:20px;}
.summary-card h3{color:white; font-size:17px;}
.summary-item{margin-top:14px; padding-top:14px; border-top:1px solid rgba(255,255,255,0.15); font-size:13.5px;}
.summary-item .lbl{font-size:11px; opacity:.7; text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px;}

/* ---- jurnal ---- */
.mood-row{display:flex; gap:8px; margin:14px 0; flex-wrap:wrap;}
.mood-opt{font-size:22px; padding:10px 14px; border-radius:14px; border:1.5px solid var(--mint-line); background:white;}
.mood-opt.selected{border-color:var(--coral); background:var(--coral-soft);}
.jtextarea{width:100%; min-height:140px; border-radius:16px; border:1.5px solid var(--mint-line); padding:16px; font-size:14px; font-family:inherit; resize:vertical; background:white;}
.journal-entry{background:white; border-radius:14px; padding:16px; box-shadow:var(--shadow); margin-bottom:10px;}
.journal-entry .meta{display:flex; justify-content:space-between; font-size:11px; color:var(--ink-soft); margin-bottom:8px;}
.status-pill{font-size:10px; font-weight:700; padding:3px 9px; border-radius:100px; background:var(--mint); color:var(--teal-dark);}

/* ---- stories feed ---- */
.story-card{background:linear-gradient(160deg, var(--white), var(--rose)); border-radius:18px; padding:22px; margin-bottom:14px; box-shadow:var(--shadow); border-left:4px solid var(--coral);}
.story-card:nth-child(3n+2){border-left-color:var(--teal);}
.story-card:nth-child(3n){border-left-color:var(--amber);}
.story-card p{font-family:'Fraunces',serif; font-style:italic; font-size:16px; line-height:1.55; color:var(--ink); margin:0;}
.story-card .num{margin-top:12px; font-size:11px; color:var(--ink-soft); text-align:right;}
.story-actions{display:flex; margin-top:10px;}
.like-btn{background:white; border:1.5px solid var(--mint-line); border-radius:100px; padding:6px 14px; font-size:12.5px; font-weight:700; display:flex; align-items:center; gap:6px;}
.like-btn.liked{border-color:var(--coral); background:var(--coral-soft);}
.cm-list{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;}
.cm-chip{font-size:11.5px; background:var(--mint); color:var(--teal-dark); padding:5px 11px; border-radius:100px; font-weight:600;}
.cm-picker{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; padding-top:10px; border-top:1px dashed var(--mint-line);}
.cm-add{font-size:11px; background:none; border:1px dashed var(--mint-line); color:var(--ink-soft); padding:5px 10px; border-radius:100px;}
.cm-add:hover{border-color:var(--coral); color:var(--coral);}

/* ---- module pages ---- */
.mod-section{margin-bottom:20px;}
.mod-section h4{font-size:14px; color:var(--teal-dark); margin-bottom:8px;}
.mod-section ul{margin:0; padding-left:20px; font-size:13.5px; line-height:1.6; color:var(--ink);}

.finish-wrap{text-align:center; padding:40px 0;}
.finish-wrap h2{font-size:24px; color:var(--teal-dark);}

@media(min-width:960px){
  .screen{padding:0 40px 40px;}
  .card, .materi-card{padding:34px;}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   DATA
========================================================= */
const AFFIRM_HOME = [
  "Kamu berhak merasa aman dan didengar.",
  "Kamu boleh bilang nggak tanpa harus merasa bersalah.",
  "Kamu nggak harus menghadapi semuanya sendirian.",
  "Perasaan nyaman atau percaya nggak pernah membuatmu salah.",
  "Kamu pantas tumbuh dengan tenang dan aman."
];

const SING_MATERI = [
  { tag:"Definisi", title:"Apa Itu Child Grooming?",
    body:`<p>Child grooming adalah proses ketika seseorang secara sengaja membangun kedekatan dan kepercayaan dengan anak untuk mendapatkan pengaruh, kemudian memanipulasi atau mengeksploitasi anak.</p><p>Grooming biasanya terjadi secara bertahap. Awalnya dapat terlihat seperti perhatian atau hubungan biasa — melalui percakapan, pujian, hadiah, bantuan, atau pertemanan.</p>`,
    callout:"Grooming tidak selalu dilakukan oleh orang asing. Seseorang yang sudah dikenal dan dipercaya juga dapat melakukan grooming." },
  { tag:"Pola", title:"Bagaimana Grooming Berkembang?",
    body:`<p>Grooming tidak selalu mengikuti urutan yang sama, tetapi dapat berkembang melalui pola:</p><ul><li>Mendekati</li><li>Membangun kedekatan</li><li>Mendapatkan kepercayaan</li><li>Membuat hubungan terasa khusus atau rahasia</li><li>Mulai melewati batas</li></ul>`,

/* =========================================================
   GENERIC QUIZ (Cek Paham)
========================================================= */
const STAGE_DISPLAY_LABEL = { Sing:'Recognize', Act:'Decide', Protect:'Respond' };
function quizScreen(label, data, answers, onAnswer, onFinish, backKey){
  const dispLabel = STAGE_DISPLAY_LABEL[label] || label;
  const qHTML = data.map((q,i)=>{
    const chosen = answers[i];
    const optsHTML = q.opts.map((o,ci)=>{
      let cls = 'quiz-opt';
      if(chosen !== undefined){
        if(ci===chosen && o[1]) cls += ' correct';
        else if(ci===chosen && !o[1]) cls += ' wrong';
        else if(o[1]) cls += ' correct';
      }
      return `<button class="${cls}" ${chosen!==undefined?'disabled':''} onclick="quizAnswer${label}(${i},${ci})">${o[0]}</button>`;
    }).join("");
    return `<div class="quiz-q"><div class="qtext">${i+1}. ${q.q}</div>${optsHTML}</div>`;
  }).join("");
  const answeredCount = Object.keys(answers).length;
  const allAnswered = answeredCount === data.length;
  return `
  ${topbarHTML('', true, backKey==='sing'?'sap':'sap')}
  <div class="screen">
    <div class="section-head"><div class="mono">${dispLabel} · Cek Paham</div><h2>Yuk, Cek Pemahamanmu!</h2><p>Ini bukan ujian — kalau belum lulus, kamu bisa pelajari lagi materinya dan coba ulang.</p></div>

  ${fixedbarHTML()}`;
}

function quizResultScreen(key, data, answers, backTo, onPass){
  let score = 0;
  data.forEach((q,i)=>{ if(q.opts[answers[i]] && q.opts[answers[i]][1]) score++; });
  const passed = score >= Math.ceil(data.length*0.7);
  return `
  ${topbarHTML('', true, backTo)}
  <div class="screen">
    <div class="quiz-result">
      <div class="score">${score}/${data.length}</div>
      ${passed
        ? `<p>🎉 Kerennn! Kamu udah paham materinya. Yuk lanjut ke tahap berikutnya.</p><button class="btn btn-coral" style="margin-top:16px;" onclick="passQuiz${key.charAt(0).toUpperCase()+key.slice(1)}()">Lanjut →</button>`
        : `<p>🌱 Belum apa-apa! Yuk pelajari lagi materinya dan coba sekali lagi.</p><button class="btn btn-primary" style="margin-top:16px;" onclick="retryQuiz${key.charAt(0).toUpperCase()+key.slice(1)}()">Ulangi</button>`}
    </div>
  </div>
  ${fixedbarHTML()}`;
}

window.retryQuizSing = ()=>{ state.sing = { materiIdx:0, inQuiz:false, quizAnswers:{}, quizDone:false }; render(); };
window.passQuizAct = ()=>{ state.progress.act=true; go('sap'); };

/* =========================================================

========================================================= */
function screenProtect(){
  const st = state.protect;
  if(st.stage === 'intro'){
    return `
    ${topbarHTML('', true, 'sap')}
    <div class="screen">
      <div class="pause-badge" style="width:60px;height:60px;border-radius:50%;background:var(--mint);display:flex;align-items:center;justify-content:center;margin:30px auto 20px;">🛡️</div>
      <div style="text-align:center;">
        <h2 style="font-size:22px; color:var(--teal-dark);">Setelah tadi belajar tentang situasi-situasi berisiko, sekarang saatnya menguatkan diri kamu.</h2>
        <p style="color:var(--ink-soft); font-size:14px; margin-top:10px;">Yuk, kita lewati tiga langkah kecil ini bareng-bareng~</p>
        <button class="btn btn-primary" style="margin-top:24px;" onclick="state.protect.stage='breath'; render();">Mulai →</button>
      </div>
    </div>
    ${fixedbarHTML()}`;
  }
  if(st.stage === 'breath'){
    const phaseLabel = st.breathPhase==='in' ? 'Tarik napas...' : st.breathPhase==='hold' ? 'Tahan...' : 'Buang napas...';
    return `
    ${topbarHTML('', true, 'sap')}
    <div class="screen" style="text-align:center;">
      <div class="section-head"><div class="mono">Respond · Napas Berirama</div><h2>Tenangkan Diri Dulu Sebentar</h2></div>
      <div class="breath-circle ${st.breathPhase}">${phaseLabel}</div>
      <p style="color:var(--ink-soft); font-size:13px;">Putaran ke-${st.breathCount+1} dari 4</p>
      <button class="btn btn-coral" onclick="breathCycle()">${st.breathCount>=3 ? 'Selesai, aku siap lanjut' : 'Lanjut napas berikutnya'}</button>
    </div>
    ${fixedbarHTML()}`;
  }
  if(st.stage === 'affirm'){
    const cardsHTML = PROTECT_AFFIRM.map(a=>`
      <button class="affirm-pick ${st.affirmSelected.has(a.id)?'selected':''}" onclick="toggleAffirm('${a.id}')">${a.text}</button>`).join("");
    return `
    ${topbarHTML('', true, 'sap')}
    <div class="screen">
      <div class="section-head"><div class="mono">Respond · Afirmasi</div><h2>Tulis Ulang Afirmasi</h2><p>Afirmasi itu kalimat buat menguatkan hati sendiri. Pilih 1-2 yang paling kerasa buat kamu.</p></div>
      <div class="affirm-pick-grid">${cardsHTML}</div>
      <div class="field" style="margin-top:18px;"><label>Mau coba tulis versimu sendiri? (opsional)</label><input placeholder="Tulis afirmasimu..." oninput="state.protect.customAffirm=this.value"></div>
      <div class="materi-nav"><div></div><button class="btn btn-primary" onclick="state.protect.stage='support'; render();">Lanjut →</button></div>
    </div>
    ${fixedbarHTML()}`;
  }
  if(st.stage === 'support'){
    const inputs = [0,1,2].map(i=>`<input placeholder="Nama orang ke-${i+1}" value="${st.support[i]}" oninput="state.protect.support[${i}]=this.value">`).join("");
    const filled = st.support.filter(s=>s.trim()).length;
    return `
    ${topbarHTML('', true, 'sap')}
    <div class="screen">
      <div class="section-head"><div class="mono">Respond · Support System</div><h2>Kalau Kamu Butuh Cerita, Siapa 3 Orang Dewasa yang Kamu Percaya?</h2><p>Data ini cuma disimpan buat kamu sendiri, nggak dikirim ke mana-mana.</p></div>
      <div class="card" style="display:flex; flex-direction:column; gap:12px;">${inputs}</div>
      <div class="materi-nav"><div></div><button class="btn btn-primary" ${filled>0?'':'disabled'} onclick="state.protect.stage='opener'; render();">Lanjut →</button></div>
    </div>
    ${fixedbarHTML()}`;
  }
  if(st.stage === 'opener'){
    const optsHTML = OPENER_LINES.map((l,i)=>`
      <button class="opener-opt ${st.openerSelected===i?'selected':''}" onclick="pickOpener(${i})">${l}</button>`).join("");
    return `
    ${topbarHTML('', true, 'sap')}
    <div class="screen">
      <div class="section-head"><div class="mono">Respond · Latihan</div><h2>Kalau Nanti Kamu Perlu Cerita, Kira-Kira Kamu Bakal Mulai Ngomong Apa?</h2></div>
      <div>${optsHTML}</div>
      <div class="field" style="margin-top:12px;"><label>Atau tulis kalimatmu sendiri</label><input placeholder="Kalimat pembukamu..." oninput="state.protect.openerCustom=this.value; state.protect.openerSelected=null;"></div>
      <div class="materi-nav"><div></div><button class="btn btn-coral" onclick="state.protect.stage='penutup'; render();">Selesai →</button></div>
    </div>
    ${fixedbarHTML()}`;
  }
  if(st.stage === 'penutup'){
    const names = st.support.filter(s=>s.trim()).join(", ") || "-";
    const opener = st.openerCustom || (st.openerSelected!==null ? OPENER_LINES[st.openerSelected] : "-");
    return `
    ${topbarHTML('', true, 'sap')}
    <div class="screen">
      <div class="section-head"><div class="mono">Respond · Selesai</div><h2>Kamu Udah Menyelesaikan Semua Tahap!</h2><p>Ini catatan kecil buat kamu simpan:</p></div>
      <div class="summary-card">
        <h3>🌟 Catatanmu</h3>
        <div class="summary-item"><div class="lbl">Orang dewasa terpercaya kamu</div>${names}</div>
        <div class="summary-item"><div class="lbl">Kalimat pembuka kalau perlu cerita</div>"${opener}"</div>
        <div class="summary-item"><div class="lbl">Ingat</div>Kamu berhak merasa aman, dan kamu nggak sendirian.</div>
      </div>
      <button class="btn btn-primary btn-block" style="margin-top:20px;" onclick="finishProtect()">Selesai</button>
    </div>
    ${fixedbarHTML()}`;
  }
}
function breathCycle(){
  const st = state.protect;
  if(st.breathCount>=3){ st.stage='affirm'; render(); return; }
  st.breathPhase = st.breathPhase==='in' ? 'hold' : st.breathPhase==='hold' ? 'out' : 'in';
  if(st.breathPhase==='in') st.breathCount++;
  render();
}
function toggleAffirm(id){
  const s = state.protect.affirmSelected;
  if(s.has(id)) s.delete(id); else s.add(id);
  render();
}
function pickOpener(i){ state.protect.openerSelected=i; state.protect.openerCustom=""; render(); }
function finishProtect(){ state.progress.protect = true; go('sap'); }

function toggleLike(id){
  const s = STORIES.find(x=>x.id===id);

function addComment(id, text){
  const s = STORIES.find(x=>x.id===id);

  s.comments.push(text);
  render();
}

/* =========================================================
   DATA KEKERASAN (CHARTS)
========================================================= */
function svgLineChart(data, opts){
  const w = opts.w||600, h = opts.h||220, pad=36;
  const vals = data.map(d=>d[1]);
  const max = Math.max(...vals)*1.15, min = 0;
  const stepX = (w-pad*1.5)/(data.length-1);
  const yOf = v => h-pad - ( (v-min)/(max-min) ) * (h-pad*1.7);
  const pts = data.map((d,i)=> [pad + i*stepX, yOf(d[1])] );
  const path = pts.map((p,i)=> (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const areaPath = path + ` L${pts[pts.length-1][0].toFixed(1)},${h-pad} L${pts[0][0].toFixed(1)},${h-pad} Z`;
  const dots = pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="${opts.color||'#1F6F65'}"/><text x="${p[0].toFixed(1)}" y="${(p[1]-10).toFixed(1)}" font-size="10.5" font-family="IBM Plex Mono" text-anchor="middle" fill="#16302C">${data[i][1]}</text>`).join('');
  const labels = data.map((d,i)=>`<text x="${pts[i][0].toFixed(1)}" y="${h-12}" font-size="10.5" font-family="IBM Plex Mono" text-anchor="middle" fill="#4B615D">${d[0]}</text>`).join('');
  const gridY = [0,0.5,1].map(f=>{
    const y = pad + f*(h-pad*1.7);
    return `<line x1="${pad}" y1="${y.toFixed(1)}" x2="${w-pad*0.5}" y2="${y.toFixed(1)}" stroke="#DCEDE8" stroke-width="1"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto;">
    ${gridY}
    <path d="${areaPath}" fill="${opts.color||'#1F6F65'}" opacity="0.08"/>
    <path d="${path}" fill="none" stroke="${opts.color||'#1F6F65'}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}${labels}
  </svg>`;
}
function svgBarChart(data, opts){
  const w = opts.w||600, h = opts.h||220, pad=36;
  const vals = data.map(d=>d[1]);
  const max = Math.max(...vals)*1.2;
  const bw = (w-pad*1.5)/data.length*0.55;
  const gap = (w-pad*1.5)/data.length;
  const bars = data.map((d,i)=>{
    const x = pad + i*gap + (gap-bw)/2;
    const bh = (d[1]/max)*(h-pad*1.7);
    const y = h-pad-bh;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="6" fill="${opts.color||'#E8875A'}"/>
      <text x="${(x+bw/2).toFixed(1)}" y="${(y-8).toFixed(1)}" font-size="10.5" font-family="IBM Plex Mono" text-anchor="middle" fill="#16302C">${d[1]}</text>
      <text x="${(x+bw/2).toFixed(1)}" y="${h-12}" font-size="10.5" font-family="IBM Plex Mono" text-anchor="middle" fill="#4B615D">${d[0]}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto;">${bars}</svg>`;
}

  <div class="screen">

/* =========================================================

========================================================= */
function render(){
  if(state.hidden){
    document.getElementById('app').innerHTML = `<div class="hide-overlay" onclick="unhide()"><span class="hint">ketuk untuk kembali</span></div>`;
    return;
  }
  const map = {
    register: screenRegister, login: screenLogin, consent: screenConsent,
    beranda: screenBeranda, sap: screenSAP,
    sing: screenSing, act: screenAct, protect: screenProtect,
    jurnal: screenJurnal, cerita: screenCerita, modul: screenModul, data: screenData,
  };
  const fn = map[state.screen] || screenBeranda;
  document.getElementById('app').innerHTML = fn() + helpSheetHTML();
}
render();
